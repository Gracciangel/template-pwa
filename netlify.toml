# Configuración de despliegue en Netlify
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requiere Node >= 20.19 / 22.12
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# SPA: las rutas desconocidas sirven index.html
# (los archivos estáticos existentes tienen prioridad sobre esta regla)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras de seguridad básicas
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# El service worker nunca debe cachearse
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# El manifest puede cachearse poco tiempo
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Assets con hash: cacheables para siempre
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
